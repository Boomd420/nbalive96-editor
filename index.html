<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Live '96 Full Web Roster Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-hover: #2a2a2a;
            --border-color: #333;
            --text-main: #e0e0e0;
            --accent-blue: #007acc;
            --accent-green: #28a745;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h1 { margin: 0; font-size: 1.6rem; color: #fff; }
        .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        button, label.btn { background: var(--accent-blue); color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; }
        button:hover, label.btn:hover { opacity: 0.9; }
        button.export-btn { background: var(--accent-green); }
        input[type="file"] { display: none; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        input[type="text"].search-input { width: 100%; max-width: 350px; padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }
        .stats-badge { background: var(--bg-card); padding: 8px 12px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 0.85rem; color: #aaa; }
        .table-wrapper { overflow-x: auto; background: var(--bg-card); border-radius: 6px; border: 1px solid var(--border-color); max-height: 75vh; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #282828; white-space: nowrap; }
        th { background: #252525; color: #fff; position: sticky; top: 0; z-index: 10; font-weight: 600; }
        tr:hover { background: var(--bg-hover); }
        input.cell-input { background: transparent; border: 1px solid transparent; color: #fff; width: 100%; max-width: 70px; padding: 4px; border-radius: 3px; font-family: inherit; }
        input.cell-input:focus { background: #000; border-color: var(--accent-blue); outline: none; }
        input.cell-input.name-input { max-width: 120px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>NBA Live '96 Web Roster Editor</h1>
        <div class="toolbar">
            <label class="btn">
                📥 Import CSV File
                <input type="file" id="csvFileInput" accept=".csv" onchange="handleFileImport(event)">
            </label>
            <button onclick="loadFromGithub()">🔄 Reload from Repository</button>
            <button class="export-btn" onclick="exportCSV()">💾 Export / Save CSV</button>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Search player by name..." onkeyup="filterTable()">
        <div class="stats-badge" id="statusMsg">Loading data from repository...</div>
    </div>

    <div class="table-wrapper">
        <table id="rosterTable">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>No.</th>
                    <th>Pos</th>
                    <th>Height (in)</th>
                    <th>Weight</th>
                    <th>OVR</th>
                    <th>Speed</th>
                    <th>3PT</th>
                    <th>Dunk</th>
                    <th>Steal</th>
                    <th>Block</th>
                    <th>Points</th>
                    <th>Assists</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
let rawHeaders = [];
let rosterData = [];

// Load default file from repo on init
window.addEventListener('DOMContentLoaded', () => {
    loadFromGithub();
});

function loadFromGithub() {
    updateStatus("Fetching NBALIVE96OGROS.CSV from server...");
    Papa.parse("NBALIVE96OGROS.CSV", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            rawHeaders = results.meta.fields;
            rosterData = results.data;
            updateStatus(`Loaded ${rosterData.length} players from repo.`);
            renderTable(rosterData);
        },
        error: function(err) {
            updateStatus("Could not find NBALIVE96OGROS.CSV. Import a local file above.");
        }
    });
}

function handleFileImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    updateStatus(`Parsing local file: ${file.name}...`);
    Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            rawHeaders = results.meta.fields;
            rosterData = results.data;
            updateStatus(`Successfully imported ${rosterData.length} players from ${file.name}`);
            renderTable(rosterData);
        }
    });
}

function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    data.forEach((player, index) => {
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
            <td><input class="cell-input name-input" value="${player['FirstName:ascii'] || ''}" onchange="updateValue(${index}, 'FirstName:ascii', this.value)"></td>
            <td><input class="cell-input name-input" value="${player['LastName:ascii'] || ''}" onchange="updateValue(${index}, 'LastName:ascii', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['JerseyNumber:1'] ?? ''}" onchange="updateValue(${index}, 'JerseyNumber:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Position:1'] ?? ''}" onchange="updateValue(${index}, 'Position:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Height:1'] ?? ''}" onchange="updateValue(${index}, 'Height:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Weight:1:+100'] ?? ''}" onchange="updateValue(${index}, 'Weight:1:+100', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Overall:1'] ?? ''}" onchange="updateValue(${index}, 'Overall:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Speed:1'] ?? ''}" onchange="updateValue(${index}, 'Speed:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['ThreePoint:1'] ?? ''}" onchange="updateValue(${index}, 'ThreePoint:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Dunk:1'] ?? ''}" onchange="updateValue(${index}, 'Dunk:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Steal:1'] ?? ''}" onchange="updateValue(${index}, 'Steal:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Block:1'] ?? ''}" onchange="updateValue(${index}, 'Block:1', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Points:2'] ?? ''}" onchange="updateValue(${index}, 'Points:2', this.value)"></td>
            <td><input class="cell-input" type="number" value="${player['Assists:2'] ?? ''}" onchange="updateValue(${index}, 'Assists:2', this.value)"></td>
        `;
        tbody.appendChild(tr);
    });
}

function updateValue(rowIndex, fieldName, value) {
    rosterData[rowIndex][fieldName] = value;
}

function filterTable() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = rosterData.filter(p => {
        const fname = (p['FirstName:ascii'] || '').toLowerCase();
        const lname = (p['LastName:ascii'] || '').toLowerCase();
        return fname.includes(query) || lname.includes(query);
    });
    renderTable(filtered);
}

function exportCSV() {
    if (!rosterData || rosterData.length === 0) {
        alert("No data available to export.");
        return;
    }
    const csvContent = Papa.unparse({
        fields: rawHeaders,
        data: rosterData
    });
    
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", "NBALIVE96OGROS.CSV");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    updateStatus("CSV exported successfully! Replace this file in your repo or use it in-game.");
}

function updateStatus(msg) {
    document.getElementById('statusMsg').innerText = msg;
}
</script>
</body>
</html>
