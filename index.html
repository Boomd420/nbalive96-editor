<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Live '96 Web ROM Editor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const TOTAL_PLAYERS = 470;
    const FIRST_NAME_LEN = 13;
    const LAST_NAME_LEN = 13;

    function NBALive96Editor() {
      const [romData, setRomData] = useState(null);
      const [romFileName, setRomFileName] = useState('');
      const [players, setPlayers] = useState([]);
      const [selectedPlayerIdx, setSelectedPlayerIdx] = useState(0);
      const [activeTab, setActiveTab] = useState('players');
      const [statusMessage, setStatusMessage] = useState('Ready. Load an NBA Live 96 ROM (.bin) to begin.');

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setRomFileName(file.name);
        const reader = new FileReader();
        reader.onload = (event) => {
          const buffer = event.target?.result;
          if (buffer) {
            setRomData(buffer);
            parseRomPlayers(buffer);
            setStatusMessage(`Successfully loaded ROM: ${file.name} (${(buffer.byteLength / 1024 / 1024).toFixed(2)} MB)`);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const parseRomPlayers = (buffer) => {
        try {
          const view = new DataView(buffer);
          const parsedPlayers = [];
          let baseOffset = 0x10000; // Standard ROM data offset approximation

          for (let i = 0; i < TOTAL_PLAYERS; i++) {
            const recordOffset = baseOffset + (i * 126);
            if (recordOffset + 126 > buffer.byteLength) break;

            const jerseyNumber = view.getUint8(recordOffset + 0);
            const position = view.getUint8(recordOffset + 1);
            const height = view.getUint8(recordOffset + 2);
            const weightRaw = view.getUint8(recordOffset + 3);
            const skinTone = view.getUint8(recordOffset + 5);
            
            const fieldGoal = view.getUint8(recordOffset + 10);
            const threePoint = view.getUint8(recordOffset + 11);
            const freeThrow = view.getUint8(recordOffset + 12);
            const dunk = view.getUint8(recordOffset + 13);
            const overall = view.getUint8(recordOffset + 27);

            let lastNameBytes = [];
            for (let b = 0; b < LAST_NAME_LEN; b++) {
              lastNameBytes.push(view.getUint8(recordOffset + 100 + b));
            }
            let firstNameBytes = [];
            for (let b = 0; b < FIRST_NAME_LEN; b++) {
              firstNameBytes.push(view.getUint8(recordOffset + 113 + b));
            }

            const decodeAscii = (arr) => 
              String.fromCharCode(...arr.filter(code => code !== 0 && code !== 32)).trim() || `Player ${i}`;

            parsedPlayers.push({
              index: i,
              firstName: decodeAscii(firstNameBytes),
              lastName: decodeAscii(lastNameBytes),
              jerseyNumber,
              position,
              height,
              weight: weightRaw + 100, // +100 lb offset rule
              skinTone,
              overall,
              fieldGoal,
              threePoint,
              freeThrow,
              dunk,
              rawOffset: recordOffset
            });
          }

          setPlayers(parsedPlayers.length > 0 ? parsedPlayers : generateMockPlayers());
        } catch (err) {
          console.error('ROM Parse Error:', err);
          setStatusMessage('Error parsing ROM binary. Loading default fallback dataset.');
          setPlayers(generateMockPlayers());
        }
      };

      const generateMockPlayers = () => {
        return Array.from({ length: 50 }, (_, i) => ({
          index: i,
          firstName: `Player`,
          lastName: `${i + 1}`,
          jerseyNumber: i + 1,
          position: i % 5,
          height: 78,
          weight: 215,
          skinTone: 1,
          overall: 75 + (i % 15),
          fieldGoal: 70,
          threePoint: 65,
          freeThrow: 75,
          dunk: 70,
          rawOffset: 0
        }));
      };

      const handlePlayerChange = (field, value) => {
        setPlayers(prev => prev.map(p => {
          if (p.index === selectedPlayerIdx) {
            return { ...p, [field]: value };
          }
          return p;
        }));
      };

      const handleDownloadRom = () => {
        if (!romData) {
          alert('No ROM loaded in memory.');
          return;
        }

        const modifiedBuffer = gasWriteBack(romData, players);
        const blob = new Blob([modifiedBuffer], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Modified_${romFileName || 'NBA_Live_96.bin'}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatusMessage('Modified ROM successfully downloaded!');
      };

      const gasWriteBack = (buffer, updatedPlayers) => {
        const newBuffer = buffer.slice(0);
        const view = new DataView(newBuffer);

        updatedPlayers.forEach(p => {
          if (p.rawOffset && p.rawOffset + 126 <= newBuffer.byteLength) {
            view.setUint8(p.rawOffset + 0, p.jerseyNumber);
            view.setUint8(p.rawOffset + 1, p.position);
            view.setUint8(p.rawOffset + 2, p.height);
            view.setUint8(p.rawOffset + 3, Math.max(0, p.weight - 100)); // Reverse weight +100 offset
            view.setUint8(p.rawOffset + 5, p.skinTone);
            view.setUint8(p.rawOffset + 10, p.fieldGoal);
            view.setUint8(p.rawOffset + 11, p.threePoint);
            view.setUint8(p.rawOffset + 12, p.freeThrow);
            view.setUint8(p.rawOffset + 13, p.dunk);
            view.setUint8(p.rawOffset + 27, p.overall);

            const writeAscii = (str, offset, maxLen) => {
              for (let i = 0; i < maxLen; i++) {
                const charCode = i < str.length ? str.charCodeAt(i) : 0;
                view.setUint8(offset + i, charCode);
              }
            };
            writeAscii(p.lastName, p.rawOffset + 100, LAST_NAME_LEN);
            writeAscii(p.firstName, p.rawOffset + 113, FIRST_NAME_LEN);
          }
        });

        return newBuffer;
      };

      const handleExportCSV = () => {
        if (players.length === 0) return;
        const headers = ['Index', 'FirstName', 'LastName', 'Jersey', 'Position', 'Height', 'Weight', 'Overall', 'FG', '3PT', 'FT'];
        const rows = players.map(p => [
          p.index,
          `"${p.firstName}"`,
          `"${p.lastName}"`,
          p.jerseyNumber,
          p.position,
          p.height,
          p.weight,
          p.overall,
          p.fieldGoal,
          p.threePoint,
          p.freeThrow
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', 'NBALive96_Players.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setStatusMessage('Player roster exported to CSV successfully.');
      };

      const currentPlayer = players[selectedPlayerIdx] || players[0];

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap items-center justify-between shadow-md">
            <div className="flex items-center space-x-3">
              <span className="text-2xl">🏀</span>
              <div>
                <h1 className="text-xl font-bold tracking-wide text-amber-400">NBA Live '96 Web ROM Editor</h1>
                <p className="text-xs text-slate-400">Client-Side GitHub Pages Standalone App</p>
              </div>
            </div>

            <div className="flex items-center space-x-4 mt-3 sm:mt-0">
              <label className="bg-amber-600 hover:bg-amber-500 text-slate-950 font-semibold px-4 py-2 rounded shadow cursor-pointer transition text-sm">
                📁 Load ROM (.bin)
                <input type="file" accept=".bin" onChange={handleFileUpload} className="hidden" />
              </label>

              <button 
                onClick={handleDownloadRom}
                disabled={!romData}
                className={`px-4 py-2 rounded font-semibold text-sm transition ${romData ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow' : 'bg-slate-700 text-slate-400 cursor-not-allowed'}`}
              >
                💾 Download Modified ROM
              </button>
            </div>
          </header>

          <div className="bg-slate-800/60 border-b border-slate-700/50 px-6 py-2 text-xs text-amber-300/90 flex justify-between items-center">
            <span>{statusMessage}</span>
            <span>Loaded File: {romFileName || 'None'}</span>
          </div>

          <div className="flex-1 flex flex-col md:flex-row overflow-hidden" style={{height: 'calc(100vh - 115px)'}}>
            <div className="w-full md:w-80 bg-slate-800/80 border-r border-slate-700 flex flex-col h-[40vh] md:h-full">
              <div className="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-800">
                <span className="font-semibold text-sm text-slate-300">Player Roster ({players.length})</span>
                <button onClick={handleExportCSV} className="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-amber-300">Export CSV</button>
              </div>
              <div className="flex-1 overflow-y-auto divide-y divide-slate-700/50">
                {players.map((p) => (
                  <div 
                    key={p.index}
                    onClick={() => setSelectedPlayerIdx(p.index)}
                    className={`px-4 py-2.5 text-sm cursor-pointer flex justify-between items-center transition ${selectedPlayerIdx === p.index ? 'bg-amber-500/20 border-l-4 border-amber-400 text-amber-300 font-medium' : 'hover:bg-slate-700/40 text-slate-300'}`}
                  >
                    <span>#{p.jerseyNumber} {p.firstName} {p.lastName}</span>
                    <span className="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-400">OVR: {p.overall}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex-1 p-6 overflow-y-auto bg-slate-900">
              {currentPlayer ? (
                <div className="max-w-3xl mx-auto bg-slate-800 border border-slate-700 rounded-lg p-6 shadow-xl">
                  <div className="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
                    <div>
                      <h2 className="text-xl font-bold text-amber-400">
                        {currentPlayer.firstName} {currentPlayer.lastName}
                      </h2>
                      <p className="text-xs text-slate-400">Player ID Index: {currentPlayer.index} | ROM Offset: 0x{currentPlayer.rawOffset.toString(16)}</p>
                    </div>
                    <div className="bg-slate-700/60 px-4 py-2 rounded text-center">
                      <div className="text-xs text-slate-400">Overall Rating</div>
                      <div className="text-lg font-extrabold text-amber-300">{currentPlayer.overall}</div>
                    </div>
                  </div>

                  <div className="flex space-x-4 border-b border-slate-700 mb-6 text-sm font-medium">
                    <button 
                      onClick={() => setActiveTab('players')}
                      className={`pb-2 border-b-2 transition ${activeTab === 'players' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                    >
                      Attributes & Identity
                    </button>
                    <button 
                      onClick={() => setActiveTab('export')}
                      className={`pb-2 border-b-2 transition ${activeTab === 'export' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                    >
                      Technical & Preservation Info
                    </button>
                  </div>

                  {activeTab === 'players' ? (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">First Name (Max 13 chars)</label>
                        <input 
                          type="text" 
                          maxLength={13}
                          value={currentPlayer.firstName}
                          onChange={e => handlePlayerChange('firstName', e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Last Name (Max 13 chars)</label>
                        <input 
                          type="text" 
                          maxLength={13}
                          value={currentPlayer.lastName}
                          onChange={e => handlePlayerChange('lastName', e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Jersey Number</label>
                        <input 
                          type="number" 
                          min={0} max={99}
                          value={currentPlayer.jerseyNumber}
                          onChange={e => handlePlayerChange('jerseyNumber', parseInt(e.target.value) || 0)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Height (inches)</label>
                        <input 
                          type="number" 
                          value={currentPlayer.height}
                          onChange={e => handlePlayerChange('height', parseInt(e.target.value) || 0)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Weight (lbs) [+100 offset]</label>
                        <input 
                          type="number" 
                          value={currentPlayer.weight}
                          onChange={e => handlePlayerChange('weight', parseInt(e.target.value) || 100)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Overall Rating</label>
                        <input 
                          type="number" 
                          min={0} max={100}
                          value={currentPlayer.overall}
                          onChange={e => handlePlayerChange('overall', parseInt(e.target.value) || 0)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Field Goal Rating</label>
                        <input 
                          type="number" min={0} max={100}
                          value={currentPlayer.fieldGoal}
                          onChange={e => handlePlayerChange('fieldGoal', parseInt(e.target.value) || 0)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">3-Point Rating</label>
                        <input 
                          type="number" min={0} max={100}
                          value={currentPlayer.threePoint}
                          onChange={e => handlePlayerChange('threePoint', parseInt(e.target.value) || 0)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Free Throw Rating</label>
                        <input 
                          type="number" min={0} max={100}
                          value={currentPlayer.freeThrow}
                          onChange={e => handlePlayerChange('freeThrow', parseInt(e.target.value) || 0)}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                        />
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-4 text-sm text-slate-300">
                      <div className="bg-slate-900 p-4 rounded border border-slate-700">
                        <h3 className="font-semibold text-amber-400 mb-2">Preservation & Technical Checklist</h3>
                        <ul className="list-disc list-inside space-y-1 text-xs text-slate-400">
                          <li><strong>Fixed String Lengths:</strong> Player names are strictly bound to 13 bytes to prevent ROM memory shifts.</li>
                          <li><strong>Weight Calculation:</strong> Stored binary byte represents `Weight - 100` lbs.</li>
                          <li><strong>Emulator Notice:</strong> Clear `.SRM` battery RAM save files in your emulator before launching modified ROMs to ensure roster updates take effect.</li>
                          <li><strong>Client-Only Security:</strong> All modifications occur purely in browser memory (`ArrayBuffer`).</li>
                        </ul>
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <div className="flex h-full items-center justify-center text-slate-500">
                  Select a player from the sidebar or load a ROM.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<NBALive96Editor />, document.getElementById('root'));
  </script>
</body>
</html>
