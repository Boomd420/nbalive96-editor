<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NBA Live '96 Editor - Windows 95 Edition</title>
    <style>
        body {
            background-color: #008080;
            font-family: "MS Sans Serif", Arial, sans-serif;
            font-size: 11px;
            margin: 0;
            padding: 20px;
            color: #000;
        }
        .win95-window {
            width: 720px;
            background-color: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            margin: 0 auto;
        }
        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title-bar-buttons button {
            background-color: #c0c0c0;
            border: 1px solid;
            border-color: #dfdfdf #404040 #404040 #dfdfdf;
            width: 16px;
            height: 14px;
            font-size: 9px;
            font-weight: bold;
            line-height: 8px;
            cursor: pointer;
        }
        .menu-bar {
            background-color: #c0c0c0;
            padding: 2px 4px;
            border-bottom: 1px solid #808080;
            display: flex;
            gap: 15px;
        }
        .menu-item {
            cursor: pointer;
            padding: 1px 4px;
        }
        .menu-item:hover {
            background-color: #000080;
            color: white;
        }
        .window-body {
            padding: 10px;
        }
        .fieldset-win95 {
            border: 1px solid #808080;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            background-color: #c0c0c0;
            padding: 8px;
            margin-bottom: 10px;
        }
        .fieldset-win95 legend {
            font-weight: bold;
            padding: 0 3px;
        }
        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
            align-items: center;
        }
        label {
            display: inline-block;
            width: 80px;
            text-align: right;
        }
        input, select {
            background-color: white;
            border: 1px solid;
            border-color: #404040 #dfdfdf #dfdfdf #404040;
            padding: 2px 4px;
            font-family: "MS Sans Serif", Arial;
            font-size: 11px;
        }
        .btn-win95 {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #dfdfdf #404040 #404040 #dfdfdf;
            padding: 4px 15px;
            font-family: "MS Sans Serif", Arial;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-win95:active {
            border-color: #404040 #dfdfdf #dfdfdf #404040;
            padding: 5px 14px 3px 16px;
        }
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            text-align: center;
        }
        .grid-stats label {
            width: auto;
            text-align: center;
            font-size: 10px;
        }
        .grid-stats input {
            width: 45px;
            text-align: right;
        }
        .status-bar {
            background-color: #c0c0c0;
            border-top: 1px solid #808080;
            padding: 3px 6px;
            font-size: 10px;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
        }
    </style>
</head>
<body>

<div class="win95-window">
    <div class="title-bar">
        <span>NBA Live '96 Editor - [Project1 - Player Editor]</span>
        <div class="title-bar-buttons">
            <button>_</button>
            <button>□</button>
            <button>×</button>
        </div>
    </div>
    <div class="menu-bar">
        <div class="menu-item"><b>F</b>ile</div>
        <div class="menu-item"><b>I</b>mport/Export</div>
        <div class="menu-item"><b>H</b>elp</div>
    </div>
    
    <div class="window-body">
        <!-- General Section -->
        <fieldset class="fieldset-win95">
            <legend>General</legend>
            <div class="row">
                <label>#:</label> <input type="text" id="txtNbr" value="28" style="width: 35px;">
                <label>Last Name:</label> <input type="text" id="txtName" value="Lang" style="width: 120px;">
                <label>First Name:</label> <input type="text" id="txtFirst" value="Andrew" style="width: 120px;">
            </div>
            <div class="row">
                <label>Position:</label>
                <select id="cPosition" style="width: 130px;">
                    <option value="0">Center</option>
                    <option value="1">Power Forward</option>
                    <option value="2">Small Forward</option>
                    <option value="3">Shooting Guard</option>
                    <option value="4">Point Guard</option>
                </select>
                <label>School:</label> <input type="text" id="cSchool" value="Arkansas" style="width: 120px;">
            </div>
        </fieldset>

        <!-- Appearance Section -->
        <fieldset class="fieldset-win95">
            <legend>Appearance</legend>
            <div class="row">
                <label>Ht.:</label> <input type="text" id="txtHeight" value="83" style="width: 45px;">
                <label>Wt.:</label> <input type="text" id="txtWeight" value="250" style="width: 45px;">
                <label>Skin Tone:</label>
                <select id="cSkin" style="width: 100px;">
                    <option value="0">Darkest</option>
                    <option value="1">Dark</option>
                    <option value="2">Light</option>
                    <option value="3">Lightest</option>
                </select>
            </div>
        </fieldset>

        <!-- Abilities Section -->
        <fieldset class="fieldset-win95">
            <legend>Abilities</legend>
            <div class="grid-stats" id="abilitiesGrid">
               <div><label>FG</label><br><input type="text" value="70"></div>
               <div><label>3P</label><br><input type="text" value="55"></div>
               <div><label>FT</label><br><input type="text" value="80"></div>
               <div><label>DNK</label><br><input type="text" value="80"></div>
               <div><label>STL</label><br><input type="text" value="67"></div>
               <div><label>BLK</label><br><input type="text" value="80"></div>
               <div><label>ORB</label><br><input type="text" value="75"></div>
               <div><label>DRB</label><br><input type="text" value="79"></div>
               <div><label>BCT</label><br><input type="text" value="68"></div>
               <div><label>DAW</label><br><input type="text" value="85"></div>
               <div><label>SPD</label><br><input type="text" value="72"></div>
               <div><label>AGI</label><br><input type="text" value="70"></div>
            </div>
        </fieldset>

        <!-- Action Buttons -->
        <div style="text-align: center; margin-top: 15px; margin-bottom: 10px;">
            <button class="btn-win95" onclick="alert('Changes saved to ROM buffer in memory!')">SAVE</button>
            <button class="btn-win95" onclick="alert('Exporting player data to CSV...');">EXPORT CSV</button>
            <button class="btn-win95" onclick="alert('Cancelled changes.')">CANCEL</button>
        </div>
    </div>
    
    <div class="status-bar" id="statusBar">
        Opening ROM... DONE. Total 470 players loaded from NBALIVE96OGROS.CSV.
    </div>
</div>

</body>
</html>
