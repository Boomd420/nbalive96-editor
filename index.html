<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Live '96 Pro Roster Editor</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --success: #16a34a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 1.15rem;
      margin: 0 0 8px 0;
      text-align: center;
      color: var(--text-main);
    }

    h3 {
      font-size: 0.95rem;
      margin: 12px 0 8px 0;
      color: #60a5fa;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 3px;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    button {
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      padding: 10px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .field-group { margin-bottom: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>NBA Live '96 Pro Roster Editor</h1>

  <div class="card">
    <label for="romFile">Load Unmodified ROM File (.bin / .md)</label>
    <input type="file" id="romFile" accept=".bin,.md" />
  </div>

  <div id="editorCard" class="card hidden">
    <label for="playerSelect">Select Player Slot (0-469 Baseline)</label>
    <select id="playerSelect"></select>

    <!-- GENERAL & BIO -->
    <h3>General & Appearance</h3>
    <div class="grid-2">
      <div class="field-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" maxlength="13" />
      </div>
      <div class="field-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" maxlength="13" />
      </div>
    </div>

    <div class="grid-3">
      <div class="field-group">
        <label for="jerseyNum">Jersey #</label>
        <input type="number" id="jerseyNum" min="0" max="99" />
      </div>
      <div class="field-group">
        <label for="position">Position Code</label>
        <input type="number" id="position" min="0" max="4" />
      </div>
      <div class="field-group">
        <label for="overall">Overall Rating</label>
        <input type="number" id="overall" min="0" max="99" />
      </div>
    </div>

    <div class="grid-3">
      <div class="field-group">
        <label for="height">Height</label>
        <input type="number" id="height" min="0" max="255" />
      </div>
      <div class="field-group">
        <label for="weight">Weight (+100)</label>
        <input type="number" id="weight" min="100" max="400" />
      </div>
      <div class="field-group">
        <label for="skinTone">Skin Tone</label>
        <input type="number" id="skinTone" min="0" max="15" />
      </div>
    </div>

    <!-- ABILITIES & RATINGS -->
    <h3>Player Abilities (0-99)</h3>
    <div class="grid-4">
      <div class="field-group"><label>Speed</label><input type="number" id="speed" min="0" max="99"></div>
      <div class="field-group"><label>3-Point</label><input type="number" id="threePoint" min="0" max="99"></div>
      <div class="field-group"><label>Field Goal</label><input type="number" id="fieldGoal" min="0" max="99"></div>
      <div class="field-group"><label>Free Throw</label><input type="number" id="freeThrow" min="0" max="99"></div>
      <div class="field-group"><label>Dunk</label><input type="number" id="dunk" min="0" max="99"></div>
      <div class="field-group"><label>Steal</label><input type="number" id="steal" min="0" max="99"></div>
      <div class="field-group"><label>Block</label><input type="number" id="block" min="0" max="99"></div>
      <div class="field-group"><label>Off Rebound</label><input type="number" id="offRebound" min="0" max="99"></div>
      <div class="field-group"><label>Def Rebound</label><input type="number" id="defRebound" min="0" max="99"></div>
      <div class="field-group"><label>Ball Control</label><input type="number" id="ballControl" min="0" max="99"></div>
      <div class="field-group"><label>Def Aware</label><input type="number" id="defAware" min="0" max="99"></div>
      <div class="field-group"><label>Off Aware</label><input type="number" id="offAware" min="0" max="99"></div>
      <div class="field-group"><label>Agility</label><input type="number" id="agility" min="0" max="99"></div>
      <div class="field-group"><label>Jump</label><input type="number" id="jump" min="0" max="99"></div>
      <div class="field-group"><label>Dribble</label><input type="number" id="dribble" min="0" max="99"></div>
    </div>

    <!-- SEASON STATISTICS -->
    <h3>Season Statistics</h3>
    <div class="grid-3">
      <div class="field-group"><label>Games</label><input type="number" id="statGames"></div>
      <div class="field-group"><label>Starts</label><input type="number" id="statStarts"></div>
      <div class="field-group"><label>Minutes</label><input type="number" id="statMinutes"></div>
      <div class="field-group"><label>Points</label><input type="number" id="statPoints"></div>
      <div class="field-group"><label>Assists</label><input type="number" id="statAssists"></div>
      <div class="field-group"><label>Steals</label><input type="number" id="statSteals"></div>
      <div class="field-group"><label>Blocks</label><input type="number" id="statBlocks"></div>
      <div class="field-group"><label>Turnovers</label><input type="number" id="statTurnovers"></div>
      <div class="field-group"><label>Fouls</label><input type="number" id="statFouls"></div>
    </div>

    <button id="savePlayerBtn">Update Player Data in Memory</button>
    <button id="downloadRomBtn" style="background-color: var(--success);">Download Modified ROM</button>
  </div>
</div>

<script>
  let romData = null;
  const TOTAL_PLAYERS = 470;
  const RECORD_SIZE = 126;
  let baseOffset = 0x028000;

  const fileInput = document.getElementById('romFile');
  const editorCard = document.getElementById('editorCard');
  const playerSelect = document.getElementById('playerSelect');

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      romData = new Uint8Array(evt.target.result);
      baseOffset = locatePlayerTable(romData);
      populatePlayerDropdown();
      editorCard.classList.remove('hidden');
      loadPlayerData(0);
    };
    reader.readAsArrayBuffer(file);
  });

  function locatePlayerTable(buf) {
    // Standard table seeker for 2MB Genesis ROMs
    for (let i = 0x20000; i < 0x60000; i += 2) {
      // Check for first valid name sequence marker "Andrew" or "A. Lang"
      if (buf[i+100] === 0x41 && buf[i+101] === 0x2E) {
        return i;
      }
    }
    return 0x028000;
  }

  function readAsciiString(buf, start, length) {
    let str = "";
    if (start + length > buf.length) return "";
    for (let i = 0; i < length; i++) {
      let code = buf[start + i];
      if (code === 0 || code === 0xFF || code === 0x20) {
        if (code === 0 || code === 0xFF) break;
      }
      if (code >= 32 && code <= 126) {
        str += String.fromCharCode(code);
      }
    }
    return str.trim();
  }

  function writeAsciiString(buf, start, length, text) {
    for (let i = 0; i < length; i++) {
      if (i < text.length) {
        buf[start + i] = text.charCodeAt(i);
      } else {
        buf[start + i] = 0x20; // Space padded
      }
    }
  }

  function getPlayerRecordOffset(index) {
    return baseOffset + (index * RECORD_SIZE);
  }

  function populatePlayerDropdown() {
    playerSelect.innerHTML = "";
    for (let i = 0; i < TOTAL_PLAYERS; i++) {
      let recStart = getPlayerRecordOffset(i);
      let last = readAsciiString(romData, recStart + 100, 13);
      let first = readAsciiString(romData, recStart + 113, 13);
      
      let name = (first || last) ? `${first} ${last}`.trim() : `Player ${i + 1}`;
      let opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${i + 1}. ${name}`;
      playerSelect.appendChild(opt);
    }
  }

  playerSelect.addEventListener('change', (e) => {
    loadPlayerData(parseInt(e.target.value));
  });

  function loadPlayerData(index) {
    let o = getPlayerRecordOffset(index);
    if (o + RECORD_SIZE > romData.length) return;

    // General & Appearance (Original.CSV / INI Mapping)
    document.getElementById('jerseyNum').value = romData[o + 7];
    document.getElementById('position').value = romData[o + 8];
    document.getElementById('height').value = romData[o + 9];
    document.getElementById('weight').value = romData[o + 10];
    document.getElementById('skinTone').value = romData[o + 12];
    document.getElementById('overall').value = romData[o + 3];

    // Abilities
    document.getElementById('fieldGoal').value = romData[o + 4];
    document.getElementById('dunk').value = romData[o + 5];
    document.getElementById('threePoint').value = romData[o + 6];
    document.getElementById('freeThrow').value = romData[o + 19];
    document.getElementById('steal').value = romData[o + 21];
    document.getElementById('block').value = romData[o + 22];
    document.getElementById('offRebound').value = romData[o + 23];
    document.getElementById('defRebound').value = romData[o + 24];
    document.getElementById('ballControl').value = romData[o + 25];
    document.getElementById('defAware').value = romData[o + 26];
    document.getElementById('speed').value = romData[o + 27];
    document.getElementById('agility').value = romData[o + 28];
    document.getElementById('jump').value = romData[o + 29];
    document.getElementById('dribble').value = romData[o + 30];
    document.getElementById('offAware').value = romData[o + 31];

    // Season Statistics (2-byte big endian)
    document.getElementById('statGames').value = romData[o + 44];
    document.getElementById('statStarts').value = romData[o + 45];
    document.getElementById('statMinutes').value = (romData[o + 46] << 8) | romData[o + 47];
    document.getElementById('statPoints').value = (romData[o + 59] << 8) | romData[o + 60];
    document.getElementById('statAssists').value = (romData[o + 55] << 8) | romData[o + 56];
    document.getElementById('statSteals').value = (romData[o + 56] << 8) | romData[o + 57];
    document.getElementById('statBlocks').value = (romData[o + 58] << 8) | romData[o + 59];
    document.getElementById('statTurnovers').value = (romData[o + 57] << 8) | romData[o + 58];
    document.getElementById('statFouls').value = (romData[o + 62] << 8) | romData[o + 63];

    document.getElementById('lastName').value = readAsciiString(romData, o + 100, 13);
    document.getElementById('firstName').value = readAsciiString(romData, o + 113, 13);
  }

  document.getElementById('savePlayerBtn').addEventListener('click', () => {
    let index = parseInt(playerSelect.value);
    let o = getPlayerRecordOffset(index);
    if (o + RECORD_SIZE > romData.length) return;

    romData[o + 7] = parseInt(document.getElementById('jerseyNum').value) || 0;
    romData[o + 8] = parseInt(document.getElementById('position').value) || 0;
    romData[o + 9] = parseInt(document.getElementById('height').value) || 0;
    romData[o + 10] = parseInt(document.getElementById('weight').value) || 0;
    romData[o + 12] = parseInt(document.getElementById('skinTone').value) || 0;
    romData[o + 3] = parseInt(document.getElementById('overall').value) || 0;

    romData[o + 4] = parseInt(document.getElementById('fieldGoal').value) || 0;
    romData[o + 5] = parseInt(document.getElementById('dunk').value) || 0;
    romData[o + 6] = parseInt(document.getElementById('threePoint').value) || 0;
    romData[o + 19] = parseInt(document.getElementById('freeThrow').value) || 0;
    romData[o + 21] = parseInt(document.getElementById('steal').value) || 0;
    romData[o + 22] = parseInt(document.getElementById('block').value) || 0;
    romData[o + 23] = parseInt(document.getElementById('offRebound').value) || 0;
    romData[o + 24] = parseInt(document.getElementById('defRebound').value) || 0;
    romData[o + 25] = parseInt(document.getElementById('ballControl').value) || 0;
    romData[o + 26] = parseInt(document.getElementById('defAware').value) || 0;
    romData[o + 27] = parseInt(document.getElementById('speed').value) || 0;
    romData[o + 28] = parseInt(document.getElementById('agility').value) || 0;
    romData[o + 29] = parseInt(document.getElementById('jump').value) || 0;
    romData[o + 30] = parseInt(document.getElementById('dribble').value) || 0;
    romData[o + 31] = parseInt(document.getElementById('offAware').value) || 0;

    writeAsciiString(romData, o + 100, 13, document.getElementById('lastName').value);
    writeAsciiString(romData, o + 113, 13, document.getElementById('firstName').value);

    let last = document.getElementById('lastName').value;
    let first = document.getElementById('firstName').value;
    playerSelect.options[index].textContent = `${index + 1}. ${first} ${last}`.trim();

    alert('Player updated in memory!');
  });

  document.getElementById('downloadRomBtn').addEventListener('click', () => {
    const blob = new Blob([romData], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nbalive96_pro_edited.bin';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
