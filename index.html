<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Live '96 Web Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Menu / File Bar -->
        <header class="toolbar">
            <h1>NBA Live '96 Web Editor</h1>
            <div class="file-actions">
                <input type="file" id="romFileInput" accept="*" style="display: none;">
                <button id="btnOpen" class="btn">Open File (.bin, .csv, .dat)</button>
                <button id="btnSave" class="btn" disabled>Save File</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="editor-workspace">
            <!-- Navigation Sidebar (Teams & Players) -->
            <aside class="sidebar">
                <div class="control-group">
                    <label for="cTeam">Team:</label>
                    <select id="cTeam" disabled>
                        <option value="">-- Load a File First --</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="cPlayer">Player:</label>
                    <select id="cPlayer" disabled>
                        <option value="">-- Select Team --</option>
                    </select>
                </div>
                <div class="status-panel" id="statusText">
                    Status: Waiting for file...
                </div>
            </aside>

            <!-- Player Detail Form (Mirrors frmPlayer.frm) -->
            <section class="player-form-panel">
                <h2>Player Details</h2>
                
                <!-- Biographical Section -->
                <fieldset class="form-section">
                    <legend>Biographical Info</legend>
                    <div class="input-grid">
                        <div class="field">
                            <label>First Name:</label>
                            <input type="text" id="txtFirstName" disabled>
                        </div>
                        <div class="field">
                            <label>Last Name:</label>
                            <input type="text" id="txtLastName" disabled>
                        </div>
                        <div class="field">
                            <label>Jersey Number:</label>
                            <input type="number" id="txtNumber" disabled>
                        </div>
                        <div class="field">
                            <label>Position:</label>
                            <input type="text" id="txtPosition" disabled>
                        </div>
                        <div class="field">
                            <label>Height:</label>
                            <input type="text" id="txtHeight" disabled>
                        </div>
                        <div class="field">
                            <label>Weight:</label>
                            <input type="number" id="txtWeight" disabled>
                        </div>
                        <div class="field">
                            <label>School:</label>
                            <input type="text" id="txtSchool" disabled>
                        </div>
                    </div>
                </fieldset>

                <!-- Appearance Section -->
                <fieldset class="form-section">
                    <legend>Appearance</legend>
                    <div class="input-grid">
                        <div class="field">
                            <label>Skin Tone:</label>
                            <input type="number" id="txtSkin" min="0" max="10" disabled>
                        </div>
                        <div class="field">
                            <label>Hair Style/Color:</label>
                            <input type="number" id="txtHair" min="0" max="20" disabled>
                        </div>
                        <div class="field">
                            <label>Face ID:</label>
                            <input type="number" id="txtFace" min="0" max="255" disabled>
                        </div>
                    </div>
                </fieldset>

                <!-- Attributes & Ratings Section -->
                <fieldset class="form-section">
                    <legend>Abilities & Ratings</legend>
                    <div id="abilitiesContainer" class="abilities-grid"></div>
                </fieldset>

                <!-- Performance Statistics Section -->
                <fieldset class="form-section">
                    <legend>Performance Statistics (txtStat)</legend>
                    <div id="statsContainer" class="abilities-grid"></div>
                </fieldset>

                <!-- Unknown / Extra Data Section -->
                <fieldset class="form-section">
                    <legend>Extra / Unknown Data (txtUnknown)</legend>
                    <div id="unknownContainer" class="abilities-grid"></div>
                </fieldset>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
