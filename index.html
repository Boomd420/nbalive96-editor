<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Live '96 Roster Editor</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --success: #16a34a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 1.15rem;
      margin: 0 0 8px 0;
      text-align: center;
      color: var(--text-main);
    }

    h3 {
      font-size: 0.95rem;
      margin: 12px 0 8px 0;
      color: #60a5fa;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 3px;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    button {
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      padding: 10px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .field-group { margin-bottom: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>NBA Live '96 Pro Roster Editor</h1>

  <div class="card">
    <label for="romFile">Load Unmodified ROM File (.bin / .md)</label>
    <input type="file" id="romFile" accept=".bin,.md" />
  </div>

  <div id="editorCard" class="card hidden">
    <label for="playerSelect">Select Player Slot (0-469 Baseline)</label>
    <select id="playerSelect"></select>

    <!-- GENERAL & BIO -->
    <h3>General & Appearance</h3>
    <div class="grid-2">
      <div class="field-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" maxlength="13" />
      </div>
      <div class="field-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" maxlength="13" />
      </div>
    </div>

    <div class="grid-3">
      <div class="field-group">
        <label for="jerseyNum">Jersey #</label>
        <input type="number" id="jerseyNum" min="0" max="99" />
      </div>
      <div class="field-group">
        <label for="position">Position Code</label>
        <input type="number" id="position" min="0" max="4" />
      </div>
      <div class="field-group">
        <label for="overall">Overall Rating</label>
        <input type="number" id="overall" min="0" max="99" />
      </div>
    </div>

    <div class="grid-3">
      <div class="field-group">
        <label for="height">Height</label>
        <input type="number" id="height" min="0" max="255" />
      </div>
      <div class="field-group">
        <label for="weight">Weight</label>
        <input type="number" id="weight" min="0" max="500" />
      </div>
      <div class="field-group">
        <label for="skinTone">Skin Tone</label>
        <input type="number" id="skinTone" min="0" max="15" />
      </div>
    </div>

    <!-- ABILITIES & RATINGS -->
    <h3>Player Abilities (0-99)</h3>
    <div class="grid-4">
      <div class="field-group"><label>Speed</label><input type="number" id="speed" min="0" max="99"></div>
      <div class="field-group"><label>3-Point</label><input type="number" id="threePoint" min="0" max="99"></div>
      <div class="field-group"><label>Field Goal</label><input type="number" id="fieldGoal" min="0" max="99"></div>
      <div class="field-group"><label>Free Throw</label><input type="number" id="freeThrow" min="0" max="99"></div>
      <div class="field-group"><label>Dunk</label><input type="number" id="dunk" min="0" max="99"></div>
      <div class="field-group"><label>Steal</label><input type="number" id="steal" min="0" max="99"></div>
      <div class="field-group
