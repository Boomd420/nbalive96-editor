<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Live '96 Browser Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NBA Live '96 Roster Editor</h1>
        <p>Client-side binary editor for classic roster files.</p>
    </header>

    <main>
        <section class="file-control">
            <label for="fileInput" class="btn">Open Roster File (.bin)</label>
            <input type="file" id="fileInput" accept=".bin,.dat" style="display: none;">
            <span id="fileNameDisplay">No file loaded</span>
        </section>

        <section id="editorWorkspace" style="display: none;">
            <div class="toolbar">
                <button id="saveBtn" class="btn primary">Save & Download Roster</button>
            </div>
            
            <div class="table-container">
                <table id="playerTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Inside Rating</th>
                            <th>Outside Rating</th>
                            <th>Jersey #</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody">
                        <!-- Populated dynamically via app.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
